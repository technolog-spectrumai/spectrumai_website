about_kicker: "Société"
about_title: "Qui nous sommes"
about_text: "Spectrum AI est une société d'ingénierie en intelligence artificielle qui construit des systèmes à fort impact pour des environnements opérationnels réels. Nous combinons exécution technique, vision produit et réseau sélectif d'experts afin de passer du prototype à une capacité prête pour le terrain."

cap_1_title: "Architecture IA appliquée"
cap_1_desc: "Nous concevons le système autour de la mission : flux de données, interfaces, contraintes, boucles de retour et résultats mesurables."
cap_2_title: "Opérations humain + machine"
cap_2_desc: "Nos produits soutiennent les opérateurs avec une intelligence explicable, observable et utile sous pression."
cap_3_title: "Ingénierie prête au terrain"
cap_3_desc: "Nous privilégions la fiabilité, l'observabilité, la sécurité et le déploiement pratique plutôt que des démonstrations de modèles isolées."

projects_title: "Projets sélectionnés"
ventures_kicker: "Portfolio"
ventures_intro: "Un ensemble ciblé de projets autour de l'autonomie, de l'intelligence de performance et des agents commerciaux IA."

project_1_title: "Robotique Agricole Autonome"
project_1_desc: "IA multi-agents pour l'agriculture de nouvelle génération : robotique, réseaux de capteurs, vision par ordinateur, opérations autonomes, décisions adaptatives et intelligence environnementale en temps réel."
project_2_title: "Sport Spectrum"
project_2_desc: "Intelligence décisionnelle pour les sports d'équipe : vision par ordinateur, analyse de performance, contexte joueur et insights tactiques pour entraîneurs et analystes."
project_3_title: "Agent d'Intelligence Commerciale"
project_3_desc: "Un agent IA situationnel qui gère les interactions commerciales, évalue les opportunités, raisonne sur le contexte et s'adapte aux marchés dynamiques."
visit_website: "En discuter →"

systems_kicker: "Stack d'ingénierie"
systems_title: "Du signal à la décision puis à l'action."
systems_text: "Les systèmes Spectrum sont construits comme des boucles opérationnelles : percevoir l'environnement, structurer l'information, recommander ou exécuter l'action, surveiller les résultats et s'améliorer en continu."
system_1_title: "Perception et fusion de données"
system_1_desc: "Vision par ordinateur, capteurs, documents, API et apports humains réunis en contexte opérationnel cohérent."
system_2_title: "Workflows agentiques"
system_2_desc: "Agents LLM, règles, outils, mémoire et validation humaine organisés en workflows de production sûrs."
system_3_title: "Supervision et contrôle"
system_3_desc: "Télémétrie, alertes, journaux d'audit et retours qui rendent l'intelligence responsable après déploiement."

philosophy_kicker: "Principe opérationnel"
philosophy_title: "Philosophie"
philosophy_text: "Nous pensons que l'intelligence doit créer une valeur opérationnelle tangible. Notre travail repose sur une ingénierie disciplinée, des partenariats sélectifs et des systèmes performants dans des environnements réels."
vision_text: "Notre vision est celle d'un monde où les systèmes intelligents sont des composants intégrés de workflows critiques — fiables, adaptatifs, observables et alignés sur les objectifs humains."

