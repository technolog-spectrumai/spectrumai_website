about_title: "Qui Nous Sommes"
about_text: "Spectrum AI est une société d’ingénierie en intelligence artificielle spécialisée dans des systèmes à fort impact, conçus pour des environnements opérationnels réels. Nous collaborons avec un nombre restreint de partenaires, en alliant excellence technique et réseau ciblé d’experts et d’opérateurs. Nos domaines couvrent les systèmes autonomes, l’intelligence appliquée et les technologies avancées d’aide à la décision — toutes pensées pour un déploiement concret et une valeur mesurable."

projects_title: "Projets Sélectionnés"

project_1_title: "Robotique Agricole Autonome"
project_1_desc: "Une plateforme d’IA multi‑agents pour l’agriculture de nouvelle génération. En combinant robotique, réseaux de capteurs et vision par ordinateur, elle permet des opérations autonomes, une prise de décision adaptative et une compréhension environnementale en temps réel."

project_2_title: "Sport Spectrum"
project_2_desc: "Une plateforme d’intelligence décisionnelle pour les sports d’équipe, intégrant vision par ordinateur, analyse de performance et insights tactiques en temps réel."

project_3_title: "Agent d’Intelligence Commerciale"
project_3_desc: "Un système d’IA conscient du contexte réel, associant modèles linguistiques et raisonnement situationnel. Il gère de manière autonome les interactions commerciales, évalue les opportunités et s’adapte à des environnements dynamiques."

visit_website: "Visiter le site →"

philosophy_title: "Philosophie"
philosophy_text: "Nous considérons que l’intelligence doit générer une valeur opérationnelle tangible. Notre approche repose sur une ingénierie rigoureuse, des partenariats sélectifs et un engagement envers des systèmes performants dans des conditions réelles. Nous nous concentrons sur l’autonomie, l’infrastructure et l’intelligence appliquée — afin de développer des technologies qui renforcent la performance, améliorent la résilience et créent un avantage stratégique durable."

