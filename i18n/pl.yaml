tagline: "Inżynieria inteligencji dla realnego wpływu."
tagline_sub: "Skupiamy się na autonomii, infrastrukturze i wglądzie operacyjnym."

about_kicker: "Firma"
about_title: "Kim jesteśmy"
about_text: "Spectrum AI to firma inżynierii sztucznej inteligencji budująca systemy o wysokim wpływie dla realnych środowisk operacyjnych. Łączymy wykonanie techniczne, myślenie produktowe i selektywną sieć ekspertów, aby przechodzić od prototypu do gotowej zdolności operacyjnej."

cap_1_title: "Architektura AI stosowanej"
cap_1_desc: "Projektujemy system wokół misji: przepływy danych, interfejsy, ograniczenia, pętle zwrotne i mierzalne efekty."
cap_2_title: "Operacje człowiek + maszyna"
cap_2_desc: "Nasze produkty wspierają operatorów inteligencją, którą można wyjaśnić, monitorować i wykorzystać pod presją."
cap_3_title: "Inżynieria gotowa do wdrożenia"
cap_3_desc: "Koncentrujemy się na niezawodności, obserwowalności, bezpieczeństwie i praktycznym wdrożeniu, a nie na izolowanych demonstracjach modeli."

projects_title: "Wybrane projekty"
ventures_kicker: "Portfolio"
ventures_intro: "Skupiony zestaw projektów wokół autonomii, inteligencji wydajnościowej i komercyjnych agentów AI."

project_1_title: "Autonomiczna Robotyka Rolnicza"
project_1_desc: "Wieloagentowa AI dla rolnictwa nowej generacji: robotyka, sieci czujników, wizja komputerowa, autonomiczne operacje polowe, decyzje adaptacyjne i inteligencja środowiskowa w czasie rzeczywistym."
project_2_title: "Sport Spectrum"
project_2_desc: "Inteligencja decyzyjna dla sportów zespołowych: wizja komputerowa, analityka wydajności, kontekst zawodników i wgląd taktyczny dla trenerów oraz analityków."
project_3_title: "Agent Inteligencji Komercyjnej"
project_3_desc: "Sytuacyjny agent AI, który zarządza interakcjami handlowymi, ocenia możliwości, rozumuje w kontekście i adaptuje się do dynamicznych rynków."
visit_website: "Porozmawiajmy →"

systems_kicker: "Stos inżynierski"
systems_title: "Od sygnału do decyzji i działania."
systems_text: "Systemy Spectrum są budowane jako pętle operacyjne: obserwują środowisko, porządkują informacje, rekomendują lub wykonują działanie, monitorują wyniki i stale się doskonalą."
system_1_title: "Percepcja i fuzja danych"
system_1_desc: "Wizja komputerowa, dane z czujników, dokumenty, API i wejścia człowieka połączone w spójny kontekst operacyjny."
system_2_title: "Przepływy agentowe"
system_2_desc: "Agenci LLM, reguły, narzędzia, pamięć i ścieżki akceptacji człowieka ułożone w bezpieczne procesy produkcyjne."
system_3_title: "Monitoring i kontrola"
system_3_desc: "Telemetria, alerty, ścieżki audytu i kanały informacji zwrotnej, dzięki którym inteligencja pozostaje rozliczalna po wdrożeniu."

philosophy_kicker: "Zasada działania"
philosophy_title: "Filozofia"
philosophy_text: "Wierzymy, że inteligencja powinna tworzyć namacalną wartość operacyjną. Nasza praca opiera się na zdyscyplinowanej inżynierii, selektywnych partnerstwach i systemach, które działają w realnych środowiskach."
vision_text: "Naszą wizją jest świat, w którym inteligentne systemy są zintegrowanymi elementami krytycznych procesów — niezawodnymi, adaptacyjnymi, obserwowalnymi i zgodnymi z celami człowieka."

