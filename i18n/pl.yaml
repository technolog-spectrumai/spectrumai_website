signal_1_title: "Autonomia"
signal_1_desc: "Agenci, robotyka, percepcja i logika misji dla środowisk fizycznych."
signal_2_title: "Systemy decyzyjne"
signal_2_desc: "Oprogramowanie operacyjne, które zamienia szum informacyjny w konkretne decyzje."
signal_3_title: "Wdrożenie"
